name: keep-awake

# 重機・農機・施設管理アプリ(Streamlit無料版)は12時間アクセスが無いと居眠りする。
# 毎朝ヘッドレスブラウザで実際に開いて起こしておく「番人」。
# GitHubのサーバ上で動くので、手元のMac/Mac miniの電源は不要。

on:
  schedule:
    # GitHubの実行は数分〜十数分ずれることがあるため、7時の始業前に確実に起きているよう
    # 6:40 JST に設定（cronはUTC基準なので UTC 21:40 = 翌6:40 JST）。
    - cron: '40 21 * * *'
  workflow_dispatch:   # ボタンからの手動実行も可能（テスト・臨時起こし用）

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright(自動ブラウザ)を準備
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: アプリを起こす
        env:
          APP_URL: https://ozaki-juki.streamlit.app/
        run: python keep_awake.py
