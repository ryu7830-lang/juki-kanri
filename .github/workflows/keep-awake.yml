name: keep-awake

# 重機・農機・施設管理アプリ(Streamlit無料版)は12時間アクセスが無いと居眠りする。
# 毎朝ヘッドレスブラウザで実際に開いて起こしておく「番人」。
# GitHubのサーバ上で動くので、手元のMac/Mac miniの電源は不要。
#
# 【2026-11-14 追記】GitHubは「公開リポで60日コミットが無い」と予約実行を自動で止める。
# 実際に 2026-10-23 に止まり、3週間アプリが朝に眠ったままになった（誰も気づかなかった）。
# 対策として、毎回の最後に「番人自身を有効にし直す」手順を入れている（下の最終ステップ）。
# また、アプリを起こせなかった回は失敗扱いで終わる＝GitHubから失敗通知が届く。

on:
  schedule:
    # 【守る時間帯】5:00〜18:00（＝13時間）。18:00〜翌5:00は使わないので寝てよい。
    # アプリは最後のアクセスから12時間で寝る（Streamlit公式仕様）。
    # 13時間 > 12時間なので1日1回では必ず穴が空く。逆に2回あれば足りる。
    #
    # 【なぜこの2つの時刻か】
    # GitHubの予約実行は必ず遅れる（過去41日の実測: 中央値52分・最大204分＝3.4時間）。
    # 遅れは無くせないので、最大3.4時間ずれても穴が空かない時刻を選んでいる。
    #
    #   00:10便 … 到着は 00:10〜03:34。最悪でも5:00の1時間26分前には着く。
    #             起こした時点から12時間なので 12:10〜15:34 まで起きている。
    #   07:20便 … 到着は 07:20〜10:44。前便の効力が切れる12:10より必ず先に着く。
    #             起こした時点から12時間なので 19:20〜22:44 まで＝18:00を1時間20分超える。
    #
    # → 最悪ケースでも 5:00〜18:00 は途切れない（3か所すべて約1時間20分の余裕）。
    # 🔴 時刻を動かす時は、次の3つの余裕がマイナスにならないか必ず計算し直すこと。
    #    ①00:10便が5:00までに着くか ②07:20便が前便の切れ目までに着くか ③18:00を超えるか
    #
    # cronはUTC基準（JST − 9時間）。
    - cron: '10 15 * * *'   # 00:10 JST … 朝5時に起きていることを保証する便
    - cron: '20 22 * * *'   # 07:20 JST … 18時まで持たせる便
  workflow_dispatch:   # ボタンからの手動実行も可能（テスト・臨時起こし用）

# 最終ステップで番人自身を有効にし直すため、Actionsへの書き込み権限が要る。
# それ以外（コードの書き換え等）はできないよう、読み取りだけに絞る。
permissions:
  actions: write
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright(自動ブラウザ)を準備
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: アプリを起こす
        env:
          APP_URL: https://ozaki-juki.streamlit.app/
        # 起こせなかったら keep_awake.py が終了コード1を返す → この回は「失敗」になり通知が届く
        run: python keep_awake.py

      - name: 番人自身を有効にし直す（60日ルールで止まらないように）
        # 起こすのに失敗した回でも必ず実行する（止まらないことの方が大事なため）。
        # ここが失敗した場合も「失敗」として通知が届く＝止まる前に気づける。
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-awake.yml/enable"
